        h3 { color: #555; margin: 20px 0 10px; }
        h4 { color: #666; margin: 15px 0 8px; }
        p { margin: 10px 0; }
        .step {

            border-radius: 6px;

            margin: 10px 0;

        .step-number {
            display: inline-block;

            font-weight: bold;

            font-size: 14px;
            line-height: 1.6;

        .code-block .comment { color: #6a9955; }
        .code-block .cmd { color: #569cd6; }

        .code-block .var { color: #9cdcfe; }
        .note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 15px 0;
        }
        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 15px 0;
        }
        .error-box {
            background: #f8d7da;
            border: 1px solid #dc3545;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 15px 0;
        }
        .info-box {
            background: #d1ecf1;
            border: 1px solid #17a2b8;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 15px 0;
        }
        table {
            width: 100%;

            margin: 15px 0;
        }

            white-space: nowrap;
            line-height: 1.5;
        }
